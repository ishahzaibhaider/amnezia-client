name: Build Android APK

on:
  push:
    branches: 
      - custom-build-modifications
      - main
  pull_request:
    branches: 
      - custom-build-modifications
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qt5compat qtshadertools qtimageformats qtmultimedia qtremoteobjects'
        cache: true
    
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 33.0.0
        ndk-version: 25.1.8937393
    
    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        cmake --version
    
    - name: Install Go (for WireGuard)
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
    
    - name: Set environment variables
      run: |
        echo "QT_HOST_PATH=$Qt6_DIR/../macos" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV
    
    - name: Build APK (arm64-v8a)
      run: |
        cd $GITHUB_WORKSPACE
        bash deploy/build_android.sh --apk arm64-v8a --move
      continue-on-error: false
    
    - name: List build outputs
      run: |
        echo "Build directory contents:"
        ls -la deploy/build/ || echo "Build directory not found"
        find . -name "*.apk" -type f || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: amnezia-vpn-simplified-apk
        path: |
          deploy/build/*.apk
          **/build/outputs/apk/**/*.apk
        retention-days: 30
        if-no-files-found: warn
    
    - name: Upload build logs on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          deploy/build/**/*.log
          **/build/**/*.log
        retention-days: 7
        if-no-files-found: ignore
