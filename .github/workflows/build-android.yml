name: Build Android APK

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.2'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qt5compat qtshadertools qtimageformats qtmultimedia qtremoteobjects'
        cache: true
    
    - name: Install Android NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.1.8937393"
    
    - name: Install CMake
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build
        cmake --version
    
    - name: Install Go (for WireGuard)
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    
    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        export PATH=$PATH:$(go env GOPATH)/bin
        gomobile init
    
    - name: Set environment variables
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393" >> $GITHUB_ENV
        echo "PATH=$PATH:$(go env GOPATH)/bin" >> $GITHUB_ENV
    
    - name: Build APK (arm64-v8a only)
      run: |
        cd $GITHUB_WORKSPACE
        bash deploy/build_android.sh --apk arm64-v8a --move
      continue-on-error: false
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: zerotrace-vpn-android-apk
        path: |
          deploy/build/*.apk
          **/build/outputs/apk/**/*.apk
        retention-days: 30
        if-no-files-found: warn
