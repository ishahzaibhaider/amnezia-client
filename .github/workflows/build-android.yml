name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - custom-build-modifications

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt for Android'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.2'
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        setup-python: 'true'
        set-env: 'true'
        cache: 'true'

    - name: 'Install Qt for Linux (host tools)'
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.6.2'
        host: 'linux'
        target: 'desktop'
        arch: 'gcc_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        setup-python: 'true'
        set-env: 'true'
        cache: 'true'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v3

    - name: 'Install Android NDK'
      run: |
        sdkmanager "ndk;25.1.8937393"
        sdkmanager "platforms;android-34"
        sdkmanager "build-tools;34.0.0"

    - name: 'Setup Java 17'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Install Go for WireGuard'
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: 'Setup ccache'
      uses: hendrikmuhs/ccache-action@v1.2

    - name: 'Build Android APK'
      run: |
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.1.8937393
        export QT_HOST_PATH=$Qt6_DIR/../gcc_64
        bash deploy/build_android.sh -a arm64-v8a

    - name: 'Find and Upload APK'
      uses: actions/upload-artifact@v4
      with:
        name: ZerotraceVPN-Android-arm64-v8a
        path: |
          deploy/build/**/*.apk
          deploy/build/**/*.aab
        retention-days: 30
